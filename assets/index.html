<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Step Logger</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Step Logger</h1>
        <div class="pills">
          <span id="rec-badge" class="pill rec" hidden>● recording</span>
          <span id="conn" class="pill off">disconnected</span>
        </div>
      </header>

      <section class="live">
        <div class="live-count"><b id="count">0</b><span id="count-sigma">± 0.0</span><small>steps</small></div>
        <div class="live-row">
          <div><span>Cadence</span><b id="cadence">0.00 ± 0.00 /s</b></div>
          <div><span>Detector</span><b id="det-count">0</b></div>
        </div>
        <div class="live-controls">
          <div class="toggle" id="modes">
            <button data-mode="cnn+det" class="selected">CNN + det</button>
            <button data-mode="cnn">CNN only</button>
          </div>
          <button id="reset">Reset</button>
        </div>
      </section>

      <section class="labels" id="labels">
        <button data-label="still">Still</button>
        <button data-label="walk" class="selected">Walk</button>
      </section>

      <button id="record" class="record">Start</button>

      <form id="steps-entry" class="steps-entry" hidden>
        <label for="steps-input">Steps counted for <b id="steps-file"></b></label>
        <div class="steps-row">
          <input id="steps-input" type="number" min="0" step="1" inputmode="numeric" required />
          <button type="submit">Save</button>
        </div>
      </form>

      <section class="status">
        <div><span>File</span><b id="file">–</b></div>
        <div><span>Time</span><b id="elapsed">0.0 s</b></div>
        <div><span>Rows</span><b id="rows">0</b></div>
        <div><span>Rate</span><b id="hz">– Hz</b></div>
        <div><span>Max gap</span><b id="gap">– ms</b></div>
        <div><span>Dropped</span><b id="dropped">0</b></div>
      </section>

      <section class="plot">
        <div class="plot-head">
          <div class="legend">
            <span class="x">x</span><span class="y">y</span><span class="z">z</span>
          </div>
          <div class="toggle">
            <button id="show-accel">Accel (g)</button>
            <button id="show-gyro" class="selected">Gyro (deg/s)</button>
          </div>
        </div>
        <canvas id="plot"></canvas>
      </section>

      <section>
        <h2>Recordings <span class="hint">(tap a walk to edit its steps)</span></h2>
        <ul id="recordings"><li class="empty">None yet</li></ul>
      </section>
    </main>
    <script src="libs/socket.io.min.js"></script>
    <script src="libs/arduino.js"></script>
    <script src="app.js"></script>
  </body>
</html>
